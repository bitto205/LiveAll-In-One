syntax = "proto3";
package livepb;
option go_package = "liveaio/listener/livepb";

message HeadersList {
  string key = 1;
  string value = 2;
}

message PushFrame {
  uint64 seqId = 1;
  uint64 logId = 2;
  uint64 service = 3;
  uint64 method = 4;
  repeated HeadersList headersList = 5;
  string payloadEncoding = 6;
  string payloadType = 7;
  bytes payload = 8;
  string logIdNew = 9;
}

message Message {
  string method = 1;
  bytes payload = 2;
  int64 msgId = 3;
  int32 msgType = 4;
  int64 offset = 5;
  bool needWrdsStore = 6;
  int64 wrdsVersion = 7;
  string wrdsSubKey = 8;
}

message LiveResponse {
  repeated Message messagesList = 1;
  string cursor = 2;
  uint64 fetchInterval = 3;
  uint64 now = 4;
  string internalExt = 5;
  uint32 fetchType = 6;
  map<string, string> routeParams = 7;
  uint64 heartbeatDuration = 8;
  bool needAck = 9;
  string pushServer = 10;
  string liveCursor = 11;
  bool historyNoMore = 12;
  string proxyServer = 13;
}

message User {
  int64 id = 1;
  int64 short_id = 2;
  string nickname = 3;
  string id_str = 132;
}

message ChatMessage {
  User user = 2;
  string content = 3;
  bool visibleToSender = 4;
}

message GiftStruct {
  int64 id = 5;
  string name = 16;
}

message GiftMessage {
  string giftId = 2;
  int64 groupCount = 4;
  int64 repeatCount = 5;
  int64 comboCount = 6;
  User user = 7;
  User toUser = 8;
  uint32 repeatEnd = 9;
  GiftStruct gift = 15;
  int64 totalCount = 29;
}

message MemberMessage {
  User user = 2;
  int64 memberCount = 3;
}

message LikeMessage {
  int64 count = 2;
  int64 total = 3;
  int64 color = 4;
  User user = 5;
  string icon = 6;
}

message RoomStatsMessage {
  string displayShort = 2;
  string displayMiddle = 3;
  string displayLong = 4;
  int64 displayValue = 5;
  int64 displayVersion = 6;
  bool incremental = 7;
  bool isHidden = 8;
  int64 total = 9;
  int64 displayType = 10;
}

message SocialMessage {
  User user = 2;
  int64 shareType = 3;
  int64 action = 4;
  string shareTarget = 5;
  uint64 followCount = 6;
}

message RoomUserSeqMessage {
  int64 total = 3;
  string totalPvForAnchor = 11;
}

message FansclubMessage {
  string content = 3;
  User user = 4;
}

message EmojiChatMessage {
  User user = 2;
  int64 emojiId = 3;
  string defaultContent = 5;
}

message ControlMessage {
  int32 status = 2;
}

message RoomRank {
  User user = 1;
  string scoreStr = 2;
}

message RoomRankMessage {
  repeated RoomRank ranksList = 2;
}
